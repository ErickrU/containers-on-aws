AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  shopfront delivery with AWS native tooling (hub/08 L200 §2.2): CodePipeline V2 pulls from GitHub
  through a CodeConnections connection, CodeBuild (ARM64, privileged for BuildKit) runs
  labs/pipelines/codepipeline/buildspec.yml to test, build, scan and push the four images, an optional
  manual approval gates non-dev environments, and a CloudFormation action re-deploys the 04-services
  stack with the new ImageTag so the ECS rolling deployment (circuit breaker + alarms) does the rollout.

Parameters:
  ProjectName:
    Type: String
    Default: shopfront
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ConnectionArn:
    Type: String
    Description: CodeConnections connection ARN to GitHub (create it in the console once and finish the handshake).
    Default: arn:aws:codeconnections:us-east-1:123456789012:connection/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  RepositoryId:
    Type: String
    Default: ErickrU/containers-on-aws
  BranchName:
    Type: String
    Default: main
  RequireApproval:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Insert a manual approval stage before the deploy.
  AlertTopicArn:
    Type: String
    Default: ''
    Description: SNS topic for pipeline failures and approvals (05-observability exports one). Empty = none.

Conditions:
  Approval: !Equals [!Ref RequireApproval, 'true']
  HasTopic: !Not [!Equals [!Ref AlertTopicArn, '']]

Resources:
  # ------------------------------------------------------------------ artifacts ---------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-pipeline-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 3 }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ------------------------------------------------------------------ CodeBuild ---------------
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/${Environment}/codebuild'
      RetentionInDays: 30

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codebuild'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*'
              - Effect: Allow
                Action: [codebuild:CreateReportGroup, codebuild:CreateReport, codebuild:UpdateReport, codebuild:BatchPutTestCases]
                Resource: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${ProjectName}-*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-images'
      Description: Test, build (multi-arch), scan and push the shopfront images
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 45
      QueuedTimeoutInMinutes: 30
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: labs/pipelines/codepipeline/buildspec.yml
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true            # BuildKit multi-arch needs it; the project builds only trusted source
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: IMAGE_PREFIX, Value: !Ref ProjectName }
          - { Name: DOCKER_BUILDKIT, Value: '1' }
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE, LOCAL_SOURCE_CACHE, LOCAL_CUSTOM_CACHE]
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # ------------------------------------------------------------------ CloudFormation deploy ---
  # The role CloudFormation assumes to change the 04-services stack. It is wider than the pipeline
  # role on purpose: the pipeline can only ask CloudFormation to run; CloudFormation holds the power.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-cfn-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-services-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:*Service*
                  - ecs:*TaskDefinition*
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:Describe*
                  - ecs:List*
                Resource: '*'
              - Effect: Allow
                Action: elasticloadbalancing:*
                Resource: '*'
              - Effect: Allow
                Action: application-autoscaling:*
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:PutRetentionPolicy, logs:DeleteLogGroup, logs:DescribeLogGroups, logs:TagResource]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/${Environment}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*'
                Condition:
                  StringEquals: { 'iam:PassedToService': ecs-tasks.amazonaws.com }
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName': [ecs.amazonaws.com, ecs.application-autoscaling.amazonaws.com, elasticloadbalancing.amazonaws.com]
              - Effect: Allow
                Action: [cloudformation:ListExports, cloudformation:DescribeStacks]
                Resource: '*'

  # ------------------------------------------------------------------ pipeline ----------------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codepipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codeconnections:UseConnection, codestar-connections:UseConnection]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds, codebuild:StopBuild]
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}-04-services/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DeployRole.Arn
              - !If
                - HasTopic
                - Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref AlertTopicArn
                - !Ref AWS::NoValue

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-${Environment}'
      RoleArn: !GetAtt PipelineRole.Arn
      PipelineType: V2
      ExecutionMode: QUEUED           # one deployment at a time, later commits wait (SUPERSEDED skips them)
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: GitHub
            Push:
              - Branches: { Includes: [!Ref BranchName] }
                FilePaths:
                  Includes: [labs/apps/**, labs/ecs/cloudformation/04-services.yaml, labs/pipelines/codepipeline/**]
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1' }
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: 'false'   # the trigger above with file-path filters starts the pipeline
              OutputArtifacts: [{ Name: Source }]
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: TestBuildScanPush
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts: [{ Name: Source }]
              OutputArtifacts: [{ Name: BuildOutput }]
              Namespace: BuildVars      # exposes #{BuildVars.IMAGE_TAG} from buildspec exported-variables
              RunOrder: 1

        - !If
          - Approval
          - Name: Approve
            Actions:
              - Name: ReleaseManager
                ActionTypeId: { Category: Approval, Owner: AWS, Provider: Manual, Version: '1' }
                Configuration: !If
                  - HasTopic
                  - NotificationArn: !Ref AlertTopicArn
                    CustomData: !Sub 'Deploy #{BuildVars.IMAGE_TAG} to ${ProjectName}-${Environment}?'
                  - CustomData: !Sub 'Deploy #{BuildVars.IMAGE_TAG} to ${ProjectName}-${Environment}?'
                RunOrder: 1
          - !Ref AWS::NoValue

        - Name: Deploy
          Actions:
            - Name: UpdateServicesStack
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: '1' }
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-${Environment}-04-services'
                TemplatePath: BuildOutput::labs/ecs/cloudformation/04-services.yaml
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt DeployRole.Arn
                # ImageTag comes from the artifact JSON the buildspec wrote; the rest keeps the stack's current values.
                ParameterOverrides: !Sub |
                  {
                    "ProjectName": "${ProjectName}",
                    "Environment": "${Environment}",
                    "ImageTag": { "Fn::GetParam": ["BuildOutput", "image-tag.json", "ImageTag"] }
                  }
              InputArtifacts: [{ Name: BuildOutput }]
              RunOrder: 1
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # ------------------------------------------------------------------ failure alerting --------
  PipelineFailedRule:
    Type: AWS::Events::Rule
    Condition: HasTopic
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline-failed'
      State: ENABLED
      EventPattern:
        source: [aws.codepipeline]
        detail-type: [CodePipeline Pipeline Execution State Change]
        detail:
          pipeline: [!Ref Pipeline]
          state: [FAILED]
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              pipeline: $.detail.pipeline
              execution: $.detail.execution-id
            InputTemplate: '"Pipeline <pipeline> FAILED (execution <execution>)"'

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}'
  BuildProjectName:
    Value: !Ref BuildProject
