# ElasticMQ (local SQS) configuration - HOCON. See labs/CONTRACT.md §5.
# Queue URLs look like http://elasticmq:9324/000000000000/orders-created; boto3 and the AWS SDK
# for JavaScript talk to it through AWS_ENDPOINT_URL_SQS=http://elasticmq:9324.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # strict = enforce the same limits as SQS (message size, attribute names, batch sizes)
  sqs-limits = strict
}

# Statistics UI and API on http://localhost:9325 (queue depth, in-flight, DLQ contents).
rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  orders-created {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "orders-created-dlq"
      maxReceiveCount = 3
    }
  }
  orders-created-dlq {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
}
