[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "shopfront-worker"
version = "0.1.0"
description = "shopfront background workers: SQS fulfillment consumer and Kafka analytics consumer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Runtime dependencies are pinned exactly; requirements.txt mirrors this list for `pip install -r`.
# OpenTelemetry instrumentation packages (0.NNb0) must match the SDK/API minor (1.NN.0).
dependencies = [
  "boto3==1.43.105",
  "psycopg[binary,pool]==3.3.6",
  "psycopg-pool==3.3.3",
  "confluent-kafka==2.15.1",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-instrumentation-botocore==0.66b0",
  "opentelemetry-instrumentation-psycopg==0.66b0",
  "aws-msk-iam-sasl-signer-python==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
