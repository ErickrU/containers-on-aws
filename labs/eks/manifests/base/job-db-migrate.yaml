# Schema and seed as an Argo CD PreSync hook: runs before the Deployments are synced, is recreated on
# every sync (BeforeHookCreation) and blocks the sync when it fails. Applied with plain kubectl it is
# an ordinary one-shot Job. The SQL mirrors labs/local/schema.sql and seed.sql (idempotent statements);
# keep them in sync, or replace this with a migration tool image (hub/08 L300 §2.5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopfront-sql
  namespace: shopfront
  labels:
    app.kubernetes.io/part-of: shopfront
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
      id           BIGSERIAL PRIMARY KEY,
      sku          TEXT NOT NULL UNIQUE,
      name         TEXT NOT NULL,
      price_cents  INTEGER NOT NULL CHECK (price_cents >= 0),
      stock        INTEGER NOT NULL CHECK (stock >= 0)
    );
    CREATE TABLE IF NOT EXISTS orders (
      id           UUID PRIMARY KEY,
      product_id   BIGINT NOT NULL REFERENCES products(id),
      quantity     INTEGER NOT NULL CHECK (quantity > 0),
      price_cents  INTEGER NOT NULL,
      status       TEXT NOT NULL CHECK (status IN ('CREATED','FULFILLED','FAILED')),
      created_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS orders_status_created_idx ON orders (status, created_at DESC);
    CREATE TABLE IF NOT EXISTS daily_stats (
      day            DATE PRIMARY KEY,
      orders_count   BIGINT NOT NULL DEFAULT 0,
      revenue_cents  BIGINT NOT NULL DEFAULT 0
    );
  02-seed.sql: |
    INSERT INTO products (sku, name, price_cents, stock) VALUES
      ('KB-MECH-87',   'Mechanical keyboard, 87 keys',        8999, 120),
      ('MS-WL-PRO',    'Wireless mouse Pro',                  4999, 250),
      ('MON-27-4K',    '27-inch 4K monitor',                 42900,  35),
      ('HUB-USBC-7',   'USB-C hub, 7 ports',                  5499, 400),
      ('CAM-1080P',    '1080p webcam',                        6999,  90),
      ('HS-ANC-BT',    'Noise-cancelling headset, Bluetooth', 15900,  60),
      ('DESK-LAMP-W',  'Desk lamp, warm white',               3499, 180),
      ('CHAIR-ERGO-M', 'Ergonomic office chair, medium',     28900,  15),
      ('CAB-USBC-2M',  'USB-C cable, 2 m',                     999, 999),
      ('SSD-NVME-2TB', 'NVMe SSD, 2 TB',                     17900,  75),
      ('MAT-DESK-XL',  'Desk mat, XL',                        2499, 300),
      ('STAND-LAPTOP', 'Aluminium laptop stand',              3999, 140)
    ON CONFLICT (sku) DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: shopfront
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: shopfront
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: shopfront
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: public.ecr.aws/docker/library/postgres:16-alpine
          command: [psql]
          args: ["$(DATABASE_URL)", -v, ON_ERROR_STOP=1, -f, /sql/01-schema.sql, -f, /sql/02-seed.sql]
          env:
            - name: HOME
              value: /tmp
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopfront-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sql
          configMap:
            name: shopfront-sql
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
