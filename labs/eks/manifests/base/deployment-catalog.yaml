# catalog: Go API on a distroless image (no shell, so no preStop sleep; the binary drains on SIGTERM
# and the ALB readiness gate keeps traffic away from pods that are not yet registered).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shopfront
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shopfront
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: shopfront
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: catalog
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
      containers:
        - name: catalog
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/shopfront/catalog:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: OTEL_SERVICE_NAME
              value: catalog
            # Go is container-aware for CPU only through GOMAXPROCS; GOMEMLIMIT tells the GC about the limit.
            - name: GOMEMLIMIT
              value: 200MiB
            - name: GOMAXPROCS
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopfront-db
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: shopfront-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
