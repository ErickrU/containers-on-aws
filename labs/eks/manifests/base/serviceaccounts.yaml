# One ServiceAccount per workload. AWS credentials come from EKS Pod Identity associations
# (cluster/eksctl-*.yaml or addons/pod-identity-associations.sh), so there is no IRSA annotation.
# The pods do not mount the Kubernetes API token: the Pod Identity webhook injects its own
# projected token volume, and none of these services talks to the API server.
# hub/06 L200 §2.3 explains the two mechanisms side by side.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: shopfront
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: shopfront
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
