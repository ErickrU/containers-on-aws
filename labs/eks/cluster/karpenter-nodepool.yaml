# Karpenter (v1 API) on the EKS standard cluster: one EC2NodeClass and two NodePools.
#
#   helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter --version 1.8.1 \
#     -n kube-system -f labs/eks/addons/karpenter-values.yaml
#   kubectl apply -f labs/eks/cluster/karpenter-nodepool.yaml
#
# Mechanics (hub/04 L200 §2.7, L400 §2.3): Karpenter watches unschedulable pods, computes the
# cheapest instance types that satisfy their requirements from the NodePool constraints, calls
# CreateFleet, and later consolidates (replaces or removes nodes) when cheaper packing exists. The
# EC2NodeClass owns everything AWS-specific: AMI family, subnets, security groups, block devices,
# IMDS settings, user data. NodePools own scheduling constraints, limits and disruption policy.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest          # pin (al2023@v20260915) in production and roll on your schedule
  role: shopfront-dev-karpenter-node # node IAM role: EKSWorkerNode + ECR pull + SSM; created out of band
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: shopfront-dev   # eksctl tags the private subnets with this key
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: shopfront-dev
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1      # pods cannot reach IMDS; they use Pod Identity
    httpTokens: required            # IMDSv2 only
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  kubelet:
    maxPods: 110                    # matches prefix delegation on nitro instances
    systemReserved: { cpu: 100m, memory: 200Mi }
    kubeReserved: { cpu: 100m, memory: 300Mi }
    evictionHard: { memory.available: 5%, nodefs.available: 10% }
  tags:
    Project: shopfront
    Environment: dev
    ManagedBy: karpenter
---
# General-purpose pool: Graviton first, Spot allowed, consolidates aggressively. Most shopfront pods
# land here. Limits cap the blast radius of a runaway scale-out.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        workload: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m, r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: [nano, micro, small, metal]
      expireAfter: 720h             # 30 days: forces a fresh AMI and OS patches
      terminationGracePeriod: 48h   # upper bound Karpenter waits for PDB-protected pods before force-deleting
  limits:
    cpu: "200"
    memory: 800Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "10%"                # at most 10% of nodes disrupted at once
      - nodes: "0"                  # no voluntary disruption during business hours (UTC)
        schedule: "0 9 * * mon-fri"
        duration: 8h
  weight: 10
---
# Stateful/critical pool: on-demand only, no Spot interruptions, slower consolidation. Pods opt in
# with nodeSelector workload=critical and toleration for the taint.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: critical-on-demand
spec:
  template:
    metadata:
      labels:
        workload: critical
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: workload
          value: critical
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64, amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [m7g, m7i, r7g]
      expireAfter: 720h
  limits:
    cpu: "64"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
  weight: 1
