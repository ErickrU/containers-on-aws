# Helm values for External Secrets Operator (chart 2.11.0) - hub/06 L200 §2.6.
#
#   helm repo add external-secrets https://charts.external-secrets.io && helm repo update
#   helm upgrade --install external-secrets external-secrets/external-secrets --version 2.11.0 \
#     -n external-secrets --create-namespace -f labs/eks/addons/external-secrets-values.yaml
#   kubectl apply -f labs/eks/addons/external-secrets-clustersecretstore.yaml
#
# ESO copies Secrets Manager values into Kubernetes Secrets on a refresh interval (the shopfront
# ExternalSecret in manifests/base/config.yaml). The controller's identity (Pod Identity association
# external-secrets/external-secrets) is the one that reads Secrets Manager, scoped to shopfront/*.
replicaCount: 2
leaderElect: true

serviceAccount:
  create: true
  name: external-secrets
  annotations: {}

installCRDs: true
crds:
  createClusterExternalSecret: true
  createClusterSecretStore: true
  createPushSecret: false

# Only reconcile stores/secrets in these namespaces; keeps the blast radius small on shared clusters.
scopedNamespace: ""
processClusterStore: true
processClusterExternalSecret: true

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }

webhook:
  replicaCount: 2
  certManager:
    enabled: false           # self-signed cert managed by the cert-controller below
certController:
  replicaCount: 1

metrics:
  service:
    enabled: true
serviceMonitor:
  enabled: false
