# Cluster-wide store pointing at AWS Secrets Manager in us-east-1. Authentication is implicit: the
# operator pod's credential chain, served by the Pod Identity agent (no accessKey, no IRSA
# annotation). The ExternalSecret in manifests/base/config.yaml references this store by name.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Restrict which namespaces may use this store (defence in depth on top of IAM scoping).
  conditions:
    - namespaces:
        - shopfront
        - observability
